name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          git diff --name-status -z origin/${{ github.base_ref }}...HEAD > changed_files.z

      - name: Write review script
        run: |
          cat > review.py << 'PYEOF'
          import os, json, urllib.request, sys, ast

          def patch_path(value):
              # Git quotes special bytes with C escapes; plain spaces stay unquoted.
              value = value.split("\t", 1)[0]
              if value.startswith('"'):
                  value = ast.literal_eval(value).encode("latin-1").decode("utf-8")
              if value == "/dev/null":
                  return None
              return value[2:] if value.startswith(("a/", "b/")) else value

          def collect_changed_lines(diff_text):
              changes = {}
              paths = []
              in_hunk = False
              for line in diff_text.split("\n"):
                  if line.startswith("diff --git "):
                      paths = []
                      in_hunk = False
                      continue
                  if not in_hunk and line.startswith(("--- ", "+++ ")):
                      path = patch_path(line[4:])
                      if path is not None and path not in paths:
                          paths.append(path)
                          changes.setdefault(path, [])
                      continue
                  if line.startswith("@@"):
                      in_hunk = True
                      continue
                  if in_hunk and line.startswith(("+", "-")):
                      # Old and new names identify the same renamed file.
                      for path in paths:
                          changes[path].append(line[1:])
              return changes

          def collect_changed_files(raw_status):
              items = [item for item in raw_status.split(b"\0") if item]
              files = set()
              index = 0
              while index < len(items):
                  status = items[index].decode("ascii")
                  index += 1
                  path_count = 2 if status.startswith(("R", "C")) else 1
                  if index + path_count > len(items):
                      raise ValueError("Incomplete NUL-delimited git name-status output")
                  for path in items[index:index + path_count]:
                      files.add(path.decode("utf-8", errors="surrogateescape"))
                  index += path_count
              return files

          MAX_DIFF_CHARS = 60000
          diff = open("pr_diff.txt").read()
          if len(diff) > MAX_DIFF_CHARS:
              print(f"Diff exceeds the {MAX_DIFF_CHARS}-character review limit; manual review required.")
              sys.exit(1)
          changed_files = collect_changed_files(open("changed_files.z", "rb").read())

          if not diff.strip():
              print("No diff found - skipping.")
              sys.exit(0)

          prompt = """Review this pull request diff for a production system. Return ONLY valid JSON in this exact format:
          {
            "verdict": "APPROVE" or "REQUEST_CHANGES",
            "summary": "One sentence overview.",
            "issues": [{"file": "relative/path", "evidence": "exact added or removed line snippet", "category": "security|safety|verification|other", "severity": "LOW|MEDIUM|HIGH", "rationale": "concrete introduced risk"}],
            "risk_level": "LOW", "MEDIUM", or "HIGH"
          }

          You are reviewing ONLY the risk introduced by this PR. Judge ADDED and REMOVED code in this diff, not the general quality of the repo. Do NOT fail a PR for unchanged context, pre-existing code outside the changed lines, or credential-related variable names that are merely referenced.

          REQUEST_CHANGES only if this PR newly introduces one or more concrete, material risks such as:
          - a hardcoded secret, token, password, API key, private key, session secret, or credential added in code or config
          - sensitive data newly exposed to clients, logs, error responses, or public files
          - an auth bypass, missing auth on a sensitive route, missing signature verification, missing permission check, or trust of unvalidated user input on a privileged path
          - command injection, SQL injection, path traversal, SSRF, unsafe deserialization, or comparable exploitable input-handling bug
          - a false-success state where critical failure is newly hidden or misreported as success
          - removal or breakage of an existing safety-critical check, timeout, validation, or verification step
          - a network call added to a critical path with no timeout where hanging would materially break the workflow
          - a newly introduced write/update/delete action against external systems without the verification/guardrails required by the surrounding spec

          APPROVE for everything else, including:
          - environment variable usage such as os.getenv(...), process.env, secrets.* , env.*, EnvironmentFile, or similar secure configuration references
          - variable names like GITHUB_TOKEN, GMAIL_USER, GMAIL_APP_PASSWORD, SECRET_KEY, API_KEY, etc. when they are read from environment/config rather than hardcoded
          - deleted insecure code or deleted hardcoded values; removing a secret is a fix, not a failure
          - unchanged context lines shown in the diff
          - refactors, formatting, renames, comments, docs, or operational changes that do not introduce concrete exploitable risk
          - speculative concerns like "it is unclear whether..." or "might be insecure" without a specific added line and a specific exploit path
          - style issues, architecture opinions, missing tests, or "could be cleaner" feedback
          - pre-existing repo problems not introduced by this PR

          Hard rules:
          - Do not fail the PR for a secret string that appears only in a removed line.
          - Do not fail the PR because a diff contains credential-related env var names.
          - Do not fail the PR for secure secret sourcing from environment/config.
          - For a normal text hunk, every issue must name the changed file and copy a nonempty exact snippet from an added or removed line of that file, without the diff marker.
          - For a blocking finding on a binary-only, mode-only, or other changed file with no added or removed text payload, use an empty evidence string and do not invent textual evidence. The validator will require manual owner review.
          - Use security for exploitable access/data exposure, safety for unsafe actions, verification for broken checks/timeouts/false success, and other for advisory concerns. Only concrete HIGH-severity security, safety, or verification findings can block.
          - Removing a required safety/auth/verification control can introduce a defect; explain the concrete unsafe effect. Benign removal of obsolete or insecure code is not a defect.
          - If you cannot identify a concrete newly introduced risk, verdict must be APPROVE.
          - issues must be [] when verdict is APPROVE.

          Diff:
          """ + diff

          payload = {
              "model": "gpt-4o",
              "messages": [{"role": "user", "content": prompt}],
              "max_tokens": 800,
              "response_format": {"type": "json_object"}
          }

          req = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"]
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=90) as resp:
                  result = json.loads(resp.read())
              review = json.loads(result["choices"][0]["message"]["content"])
          except Exception as e:
              print("Codex call failed: " + str(e), file=sys.stderr)
              sys.exit(1)

          verdict = review["verdict"]
          summary = review.get("summary", "No summary.")
          issues  = review["issues"]
          risk    = review.get("risk_level", "UNKNOWN")

          if verdict not in {"APPROVE", "REQUEST_CHANGES"} or not isinstance(issues, list):
              print("Invalid review contract; failing closed.", file=sys.stderr)
              sys.exit(1)
          if verdict == "APPROVE" and issues:
              print("Inconsistent review contract; failing closed.", file=sys.stderr)
              sys.exit(1)
          changed = collect_changed_lines(diff)
          verified = []
          unverifiable_blocking = []
          for issue in issues:
              if not isinstance(issue, dict) or any(
                  not isinstance(issue.get(field), str)
                  for field in ("file", "evidence", "category", "severity", "rationale")
              ):
                  print("Invalid finding contract; failing closed.", file=sys.stderr)
                  sys.exit(1)
              if issue["category"] not in {"security", "safety", "verification", "other"} or issue["severity"] not in {"LOW", "MEDIUM", "HIGH"}:
                  print("Invalid finding classification; failing closed.", file=sys.stderr)
                  sys.exit(1)
              file_path = issue["file"]
              evidence = issue["evidence"].strip()
              authenticated_lines = changed.get(file_path, [])
              is_blocking_finding = (
                  verdict == "REQUEST_CHANGES"
                  and issue["category"] in {"security", "safety", "verification"}
                  and issue["severity"] == "HIGH"
              )
              if evidence and any(evidence in line for line in authenticated_lines):
                  verified.append(issue)
              elif (
                  is_blocking_finding
                  and file_path in changed_files
                  and not any(line.strip() for line in authenticated_lines)
              ):
                  unverifiable_blocking.append(issue)
          blocking = [
              issue for issue in verified
              if issue["category"] in {"security", "safety", "verification"}
              and issue["severity"] == "HIGH"
          ]
          manual_review_required = bool(unverifiable_blocking)
          block_merge = verdict == "REQUEST_CHANGES" and (bool(blocking) or manual_review_required)
          verdict_label = "MANUAL OWNER REVIEW REQUIRED" if manual_review_required else ("CHANGES REQUIRED" if block_merge else "APPROVED")
          if verdict == "REQUEST_CHANGES" and not blocking and not manual_review_required:
              summary += " No verified blocking evidence matched added or removed PR lines; findings are advisory."

          lines = [
              "## Codex PR Review: " + verdict_label,
              "",
              "**Risk Level:** " + risk,
              "**Summary:** " + summary,
          ]
          if verified:
              lines += ["", "**Verified issues:**"] + [
                  f"- [{i['severity']}] {i['file']}: {i['rationale']} Evidence: `{i['evidence']}`"
                  for i in verified
              ]
          if unverifiable_blocking:
              lines += ["", "**Manual owner review required:**"] + [
                  f"- [HIGH] {i['file']}: {i['rationale']} The changed file has no authenticated added or removed text payload; no evidence was fabricated."
                  for i in unverifiable_blocking
              ]
          if not verified and not unverifiable_blocking:
              lines += ["", "**No issues found.**"]
          if block_merge:
              instruction = (
                  "_Manual owner review is required for the non-hunk finding above._"
                  if manual_review_required
                  else "_Fix the issues above and push a new commit to re-trigger this review._"
              )
              lines += ["", "---", instruction]

          body = "\n".join(lines)

          comment_payload = json.dumps({"body": body}).encode()

          comment_req = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["REPO"] + "/issues/" + os.environ["PR_NUMBER"] + "/comments",
              data=comment_payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json"
              }
          )

          with urllib.request.urlopen(comment_req, timeout=90) as resp:
              print("Review posted: " + verdict + " | Risk: " + risk)

          if block_merge:
              print("Issues found - failing status check. Merge is blocked.")
              sys.exit(1)
          PYEOF

      - name: Run Codex Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_ENGINEERING_REVIEWS_CI_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 review.py
